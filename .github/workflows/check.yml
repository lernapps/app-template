name: Check

# Every template is a working app: `lernapps check` (format, lint, type check, unit tests, build, the checks of the
# built app, the end-to-end tests) passes in each folder, with the @lernapps/tooling version its package.json pins.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        template: [quiz]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.template }}/package-lock.json
      - run: npm ci
      - run: npx lernapps check
