name: Check

# The runtime package at the root (format, lint, type check, unit tests, build) and every template folder as an app:
# `lernapps check` (format, lint, type check, unit tests, build, the checks of the built app, the end-to-end tests)
# passes in each, with the runtime of this commit (file:..) and the @lernapps/tooling version the folder pins.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # @lernapps/tooling is an optional peer (apps have it); the type check needs it: the version the quiz pins.
      - run: npm install --no-save --no-audit --no-fund "$(node -p 'require("./quiz/package.json").devDependencies["@lernapps/tooling"]')"
      - run: npx vp check
      - run: npx vp test run

  template:
    strategy:
      fail-fast: false
      matrix:
        template: [quiz]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci # the runtime's build tools, for file:..
      - run: npm install --no-audit --no-fund
        working-directory: ${{ matrix.template }}
      - run: npx lernapps check
        working-directory: ${{ matrix.template }}
